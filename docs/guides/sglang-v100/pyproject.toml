[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vf-sglang-v100"
version = "0.1.0"
description = "Select SGLang's PyTorch attention and expert reduction on a Tesla V100"

[project.entry-points."sglang.srt.plugins"]
vf_sglang_v100 = "vf_sglang_v100:configure"

[tool.setuptools]
py-modules = ["vf_sglang_v100"]
